name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate --schema=prisma/schema.prisma

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        # We don't need viewer's `next build` here (would require a DB
        # at build time for some pages); typecheck covers compilation.
        # Build the backend services to catch tsc-emit issues.
        run: |
          pnpm --filter @visualize/ingest build
          pnpm --filter @visualize/mcp build
