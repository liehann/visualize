name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (action.yml + workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        # Catches the class of bug that broke @main twice in one day:
        # ${{ github.token }} as an input default (not allowed) and
        # ${{ … }} expressions inside `description:` strings (parsed
        # eagerly by the runner). Fast, no runtime, runs on every PR.
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -version
      - name: Lint action.yml + .github/workflows/*
        run: ./actionlint -color action.yml .github/workflows/*.yml

  typecheck:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate --schema=prisma/schema.prisma

      - name: Build core (needed for downstream typechecks)
        run: pnpm --filter @visualize/core build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        # All unit tests across the workspace — parser, route helpers,
        # MCP tool dispatch, lib functions. Fast in-memory tests with no
        # DB and no docker. Production-like compose smoke runs separately.
        run: pnpm -r test

      - name: Build
        # We don't need viewer's `next build` here (would require a DB
        # at build time for some pages); typecheck covers compilation.
        # Build the backend services to catch tsc-emit issues.
        run: |
          pnpm --filter @visualize/ingest build
          pnpm --filter @visualize/mcp build
