name: 'Visualize for Playwright'
description: >-
  Two modes for integrating with a Visualize instance:
    - `upload-report` (default): bundle the Playwright report + test-results
      and POST to /runs, with auto-detected branch/PR/commit/CI run URL.
    - `fetch-baselines`: pull approved baselines for the project into the
      working tree before Playwright runs, so `toHaveScreenshot()` reads
      them as the source of truth (no goldens in git).

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  mode:
    description: >-
      `upload-report` (default) posts a Playwright run to the Visualize
      ingest. `fetch-baselines` downloads approved baselines into the
      working tree before tests run.
    required: false
    default: 'upload-report'
  url:
    description: >-
      Base URL of your Visualize ingest service
      (e.g. https://visualize-api.example.com).
    required: true
  secret:
    description: 'Bearer token (`API_SECRET`) for the ingest service.'
    required: true
  project:
    description: >-
      Project slug. The project must already exist (create it via the
      viewer or MCP `create_project`); ingest also auto-creates on first
      upload.
    required: true
  project-name:
    description: 'Human-friendly project name (defaults to the slug).'
    required: false
  report-path:
    description: >-
      Path to the Playwright `playwright-report/` directory. Defaults to
      `./playwright-report`. Only used in `upload-report` mode.
    required: false
    default: './playwright-report'
  test-results-path:
    description: >-
      Path to Playwright's `test-results/` directory (videos, failure
      screenshots, traces). Bundled alongside the report so attachment
      paths in report.json resolve. Defaults to `./test-results`. Only
      used in `upload-report` mode.
    required: false
    default: './test-results'
  baseline-path:
    description: >-
      Optional (upload-report mode): path to a directory tree of golden
      PNGs (e.g. Playwright's `__screenshots__/`). Each PNG is uploaded
      with its path relative to the workspace root as the canonical
      baseline path — fetch-baselines round-trips them back to the same
      location on the next CI run.

      Set this when bootstrapping a new project: Playwright writes new
      goldens here on first-time-snapshot tests, and uploading them
      seeds the baseline set so subsequent CI runs have something to
      diff against. For approving DIFFs (existing baseline that
      changed), use the viewer's Approve button — Playwright doesn't
      write to this dir on a diff, only on first-time-write, so this
      step is idempotent across normal runs.
    required: false
  fail-on-error:
    description: >-
      If true, the action fails the workflow when the upload (or fetch)
      fails. Defaults to false so a flaky Visualize doesn't block CI.
    required: false
    default: 'false'
  viewer-url:
    description: >-
      Public URL of the Visualize viewer (e.g. https://visualize.example.com).
      When set together with `comment-on-pr: true`, the action upserts a
      sticky PR comment with the run summary and a deep-link.
    required: false
  comment-on-pr:
    description: >-
      Whether to upsert a sticky PR comment summarizing the run. Requires
      `viewer-url` and a `github-token` with `pull-requests: write` (the
      default `${{ github.token }}` works for PRs from the same repo when
      the workflow grants the permission).
    required: false
    default: 'true'
  set-status-check:
    description: >-
      Whether to post a `visualize/visual-diffs` commit status. The check
      is `pending` when there are unreviewed diffs (blocks merge under
      branch protection) and `success` when the run had no visual changes.
      Requires `viewer-url` (so the check can deep-link to the run) and a
      `github-token` with `statuses: write`.
    required: false
    default: 'true'
  github-token:
    description: >-
      Token used to post the PR comment. Defaults to `${{ github.token }}`.
      For PRs from forks the default token is read-only — provide a
      separate token (or run the comment step from a `pull_request_target`
      workflow) to enable comments there.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Detect git metadata
      id: meta
      shell: bash
      run: |
        echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"
        echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        if [ -n "${{ github.event.pull_request.number }}" ]; then
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        fi
        echo "ci_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

    - name: Detect runner platform
      id: plat
      if: inputs.mode == 'upload-report' || inputs.mode == 'fetch-baselines'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)   echo "platform=linux"  >> "$GITHUB_OUTPUT" ;;
          macOS)   echo "platform=darwin" >> "$GITHUB_OUTPUT" ;;
          Windows) echo "platform=win32"  >> "$GITHUB_OUTPUT" ;;
          *)       echo "platform=linux"  >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Fetch approved baselines from Visualize
      if: inputs.mode == 'fetch-baselines'
      shell: bash
      run: |
        set -euo pipefail
        echo "Fetching approved baselines for ${{ inputs.project }} from ${{ inputs.url }}"
        # 1. List approved baselines.
        LIST_JSON="$RUNNER_TEMP/visualize-baselines.json"
        set +e
        STATUS=$(curl -sS -o "$LIST_JSON" -w '%{http_code}' \
          -H "Authorization: Bearer ${{ inputs.secret }}" \
          "${{ inputs.url }}/projects/${{ inputs.project }}/baselines")
        CURL_RC=$?
        set -e
        if [ "$CURL_RC" != "0" ] || [ "$STATUS" != "200" ]; then
          echo "::warning::Visualize baseline list returned status=$STATUS curl=$CURL_RC"
          if [ "${{ inputs.fail-on-error }}" = "true" ]; then exit 1; fi
          exit 0
        fi
        COUNT=$(jq '.baselines | length' "$LIST_JSON")
        echo "::notice title=Visualize::Fetched $COUNT approved baselines"
        if [ "$COUNT" = "0" ]; then exit 0; fi
        # 2. Iterate and download each PNG to its repo-relative path.
        # `path` is supplied by the server and used verbatim. We refuse
        # any path with '..' segments — defense in depth against a
        # malicious or buggy ingest.
        jq -r '.baselines[] | "\(.id)\t\(.path)"' "$LIST_JSON" | while IFS=$'\t' read -r ID PATH_REL; do
          case "$PATH_REL" in
            *'..'*|/*) echo "::warning::Skipping suspicious baseline path: $PATH_REL"; continue ;;
          esac
          DEST="$GITHUB_WORKSPACE/$PATH_REL"
          mkdir -p "$(dirname "$DEST")"
          set +e
          STATUS=$(curl -sS -o "$DEST" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ inputs.secret }}" \
            "${{ inputs.url }}/baselines/$ID/image")
          CURL_RC=$?
          set -e
          if [ "$CURL_RC" != "0" ] || [ "$STATUS" != "200" ]; then
            echo "::warning::Baseline $ID download returned status=$STATUS curl=$CURL_RC"
            rm -f "$DEST"
            if [ "${{ inputs.fail-on-error }}" = "true" ]; then exit 1; fi
          fi
        done

    - name: Upload Playwright report
      id: upload
      if: inputs.mode == 'upload-report' && hashFiles(format('{0}/report.json', inputs.report-path)) != ''
      shell: bash
      run: |
        set -euo pipefail
        REPORT_DIR="${{ inputs.report-path }}"
        # Default Playwright outputDir; can be overridden by users with a
        # custom config but covers the 95% case. We zip both into a single
        # bundle: report.json (from the JSON reporter) references absolute
        # paths into test-results/, so without the latter the viewer ends
        # up with broken video / screenshot references.
        TEST_RESULTS_DIR="${{ inputs.test-results-path }}"
        STAGING="$RUNNER_TEMP/visualize-bundle"
        ZIP="$RUNNER_TEMP/visualize-bundle.zip"
        rm -rf "$STAGING" "$ZIP"
        mkdir -p "$STAGING"
        cp -R "$REPORT_DIR/." "$STAGING/"
        if [ -d "$TEST_RESULTS_DIR" ]; then
          cp -R "$TEST_RESULTS_DIR" "$STAGING/test-results"
        fi
        ( cd "$STAGING" && zip -rq "$ZIP" . )

        META=$(jq -nc \
          --arg projectSlug "${{ inputs.project }}" \
          --arg projectName "${{ inputs.project-name }}" \
          --arg branch "${{ steps.meta.outputs.branch }}" \
          --arg commitSha "${{ steps.meta.outputs.commit }}" \
          --arg ciProvider "github" \
          --arg ciRunUrl "${{ steps.meta.outputs.ci_run_url }}" \
          --arg platform "${{ steps.plat.outputs.platform }}" \
          --argjson prNumber "${{ steps.meta.outputs.pr || 'null' }}" \
          '{projectSlug:$projectSlug, projectName:$projectName, branch:$branch, commitSha:$commitSha, ciProvider:$ciProvider, ciRunUrl:$ciRunUrl, prNumber:$prNumber, platform:$platform} | with_entries(select(.value != null and .value != ""))')

        echo "Posting report to ${{ inputs.url }}/runs"
        # Capture curl's exit code separately so a network/TLS failure
        # surfaces as a warning rather than killing the whole workflow.
        # `set -e` would otherwise abort here before we evaluate STATUS.
        set +e
        STATUS=$(curl -sS -o "$RUNNER_TEMP/visualize-response.json" -w '%{http_code}' \
          -X POST "${{ inputs.url }}/runs" \
          -H "Authorization: Bearer ${{ inputs.secret }}" \
          -F "meta=$META" \
          -F "bundle=@$ZIP")
        CURL_RC=$?
        set -e

        if [ "$CURL_RC" != "0" ]; then
          echo "::warning::Visualize upload failed at the network/TLS layer (curl exit $CURL_RC)."
          if [ "${{ inputs.fail-on-error }}" = "true" ]; then
            exit 1
          fi
        else
          cat "$RUNNER_TEMP/visualize-response.json"
          echo
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "200" ]; then
            echo "::warning::Visualize upload returned $STATUS"
            if [ "${{ inputs.fail-on-error }}" = "true" ]; then
              exit 1
            fi
          else
            ID=$(jq -r '.id // empty' "$RUNNER_TEMP/visualize-response.json")
            if [ -n "$ID" ]; then
              echo "::notice title=Visualize::Run uploaded: ${{ inputs.url }}/runs/$ID"
              echo "run_id=$ID" >> "$GITHUB_OUTPUT"
              echo "run_status=$(jq -r '.status // \"\"' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
              echo "total=$(jq -r '.totals.total // 0' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
              echo "passed=$(jq -r '.totals.passed // 0' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
              echo "failed=$(jq -r '.totals.failed // 0' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
              echo "flaky=$(jq -r '.totals.flaky // 0' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
              echo "skipped=$(jq -r '.totals.skipped // 0' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
              echo "diffs=$(jq -r '.diffs // 0' "$RUNNER_TEMP/visualize-response.json")" >> "$GITHUB_OUTPUT"
            fi
          fi
        fi

    - name: Upload baselines
      if: inputs.mode == 'upload-report' && inputs.baseline-path != ''
      shell: bash
      run: |
        set -euo pipefail
        DIR="${{ inputs.baseline-path }}"
        [ -d "$DIR" ] || { echo "baseline-path '$DIR' is not a directory"; exit 1; }
        # Each PNG's path relative to the workspace root is uploaded as
        # the canonical baseline path — fetch-baselines writes it back to
        # the same location on the next CI run, so paths must round-trip
        # exactly. Use realpath to canonicalize then strip the workspace
        # prefix; this handles `./` and trailing slash variants.
        WS="$(cd "$GITHUB_WORKSPACE" && pwd)"
        find "$DIR" -name '*.png' -type f | while read -r png; do
          ABS="$(cd "$(dirname "$png")" && pwd)/$(basename "$png")"
          PATH_REL="${ABS#$WS/}"
          NAME=$(basename "$png" .png)
          META=$(jq -nc \
            --arg projectSlug "${{ inputs.project }}" \
            --arg path "$PATH_REL" \
            --arg name "$NAME" \
            --arg branch "${{ steps.meta.outputs.branch }}" \
            --arg commitSha "${{ steps.meta.outputs.commit }}" \
            '{projectSlug:$projectSlug, path:$path, name:$name, branch:$branch, commitSha:$commitSha}')
          echo "Uploading baseline: $PATH_REL"
          set +e
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "${{ inputs.url }}/baselines" \
            -H "Authorization: Bearer ${{ inputs.secret }}" \
            -F "meta=$META" \
            -F "image=@$png")
          CURL_RC=$?
          set -e
          if [ "$CURL_RC" != "0" ]; then
            echo "::warning::Baseline upload for $NAME failed at the network/TLS layer (curl exit $CURL_RC)"
            if [ "${{ inputs.fail-on-error }}" = "true" ]; then exit 1; fi
          elif [ "$STATUS" != "200" ]; then
            echo "::warning::Baseline upload for $NAME returned $STATUS"
            if [ "${{ inputs.fail-on-error }}" = "true" ]; then exit 1; fi
          fi
        done

    - name: Post PR comment
      if: >-
        inputs.mode == 'upload-report' &&
        inputs.comment-on-pr == 'true' &&
        inputs.viewer-url != '' &&
        steps.meta.outputs.pr != '' &&
        steps.upload.outputs.run_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        SLUG='${{ inputs.project }}'
        NAME='${{ inputs.project-name }}'
        [ -z "$NAME" ] && NAME="$SLUG"
        VIEWER='${{ inputs.viewer-url }}'
        VIEWER="${VIEWER%/}"
        RUN_ID='${{ steps.upload.outputs.run_id }}'
        RUN_STATUS='${{ steps.upload.outputs.run_status }}'
        PASSED='${{ steps.upload.outputs.passed }}'
        FAILED='${{ steps.upload.outputs.failed }}'
        FLAKY='${{ steps.upload.outputs.flaky }}'
        SKIPPED='${{ steps.upload.outputs.skipped }}'
        TOTAL='${{ steps.upload.outputs.total }}'
        DIFFS='${{ steps.upload.outputs.diffs }}'
        BRANCH='${{ steps.meta.outputs.branch }}'
        COMMIT='${{ steps.meta.outputs.commit }}'
        SHORT_SHA="${COMMIT:0:7}"
        PR='${{ steps.meta.outputs.pr }}'
        REPO='${{ github.repository }}'
        SERVER='${{ github.server_url }}'

        case "$RUN_STATUS" in
          passed)        BADGE='✅ **passed**' ;;
          failed)        BADGE='❌ **failed**' ;;
          flaky)         BADGE='🟡 **flaky**' ;;
          skipped|*)     BADGE="⚪ **${RUN_STATUS:-unknown}**" ;;
        esac

        DIFFS_LINE=""
        if [ "${DIFFS:-0}" -gt 0 ]; then
          PLURAL=""
          [ "$DIFFS" -ne 1 ] && PLURAL="s"
          DIFFS_LINE=$(printf '\n> 👁 **%s visual change%s detected** — review and approve at %s/runs/%s\n' "$DIFFS" "$PLURAL" "$VIEWER" "$RUN_ID")
        fi

        MARKER="<!-- visualize-pr-comment:${SLUG} -->"
        BODY=$(printf '%s\n<!-- visualize commit:%s run:%s -->\n\n### 👁 Visualize · %s\n\n%s\n\n| ✓ passed | ✗ failed | 🟡 flaky | ⏭ skipped | total |\n| --- | --- | --- | --- | --- |\n| %s | %s | %s | %s | %s |\n%s\n[**View run →**](%s/runs/%s) · [`%s`](%s/%s/commit/%s) · branch `%s`\n' \
          "$MARKER" \
          "$COMMIT" "$RUN_ID" \
          "$NAME" \
          "$BADGE" \
          "$PASSED" "$FAILED" "$FLAKY" "$SKIPPED" "$TOTAL" \
          "$DIFFS_LINE" \
          "$VIEWER" "$RUN_ID" \
          "$SHORT_SHA" "$SERVER" "$REPO" "$COMMIT" \
          "$BRANCH")

        # Find existing sticky comment by marker.
        EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1 || true)

        if [ -n "$EXISTING" ]; then
          echo "::notice title=Visualize::Updating PR comment $EXISTING"
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
        else
          echo "::notice title=Visualize::Creating PR comment on #$PR"
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
        fi

    - name: Set commit status for visual diffs
      if: >-
        inputs.mode == 'upload-report' &&
        inputs.set-status-check == 'true' &&
        inputs.viewer-url != '' &&
        steps.upload.outputs.run_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        VIEWER='${{ inputs.viewer-url }}'
        VIEWER="${VIEWER%/}"
        RUN_ID='${{ steps.upload.outputs.run_id }}'
        DIFFS='${{ steps.upload.outputs.diffs }}'
        COMMIT='${{ steps.meta.outputs.commit }}'
        REPO='${{ github.repository }}'
        # The check is set on the PR's head commit (which is what GITHUB_SHA
        # is for pull_request workflows), so branch protection sees it on
        # the right ref.
        if [ "${DIFFS:-0}" -gt 0 ]; then
          STATE="pending"
          PLURAL=""
          [ "$DIFFS" -ne 1 ] && PLURAL="s"
          DESC="$DIFFS visual change$PLURAL pending review"
        else
          STATE="success"
          DESC="No unreviewed visual diffs"
        fi
        echo "::notice title=Visualize::status=$STATE ($DESC) on $COMMIT"
        # Fail-soft: a token without statuses:write (e.g. fork PR with
        # default token) shouldn't break the workflow. Suppress non-2xx
        # exits but log them.
        set +e
        gh api -X POST "repos/$REPO/statuses/$COMMIT" \
          -f state="$STATE" \
          -f context="visualize/visual-diffs" \
          -f description="$DESC" \
          -f target_url="$VIEWER/runs/$RUN_ID" >/dev/null
        RC=$?
        set -e
        if [ "$RC" != "0" ]; then
          echo "::warning::Failed to set commit status (rc=$RC). The token may lack statuses:write — this is expected on fork PRs with the default GITHUB_TOKEN."
          if [ "${{ inputs.fail-on-error }}" = "true" ]; then exit 1; fi
        fi
